name: Windows installer
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --name SeamlessForge --collect-all PySide6 --collect-all OpenGL main.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" installer\SeamlessForge.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: SeamlessForge-Windows-Installer
          path: dist/installer/SeamlessForge-Setup.exe
          if-no-files-found: error
